name: release
description: release metabol
inputs:
  tag:
    description: tag name to be released
    default: ''
  token:
    description: GitHub token
    required: true
runs:
  using: composite
  steps:
  - name: setup go
    uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
    with:
      go-version: stable
  - name: crossbuild
    run: |
      make crossbuild
    shell: bash
  - name: upload
    uses: tcnksm/ghr@766f869eacbbb086e8860cf0f0192dda6e8e67e1 # v0.18.3
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      path: dist/${{ inputs.tag || github.ref_name }}
      token: ${{ inputs.token }}
  - uses: haya14busa/action-update-semver@7d2c558640ea49e798d46539536190aff8c18715 # v1.5.1
    with:
      github_token: ${{ inputs.token }}
      tag: ${{ inputs.tag }}
      major_version_tag_only: true
