name: Run metabol
description: Collect articles for logical time windows and save them as Markdown
author: Songmu
inputs:
  config:
    description: Path to the metabol configuration file
    required: false
  root:
    description: Directory in which mdhq stores Markdown
    required: false
  assets:
    description: Whether to download article assets
    required: false
  update:
    description: Whether to update existing Markdown
    required: false
  timezone:
    description: IANA timezone used to calculate the processing window
    required: false
  at:
    description: RFC 3339 timestamp or YYYY-MM-DD date selecting a logical window
    required: false
  window-count:
    description: Number of consecutive logical windows to process (1-366)
    required: false
outputs:
  manifest:
    description: Absolute path to the JSONL manifest
    value: ${{ steps.metabol.outputs.manifest }}
  count:
    description: Number of nonempty lines in the JSONL manifest
    value: ${{ steps.metabol.outputs.count }}
runs:
  using: composite
  steps:
    - name: Install and run metabol
      id: metabol
      shell: bash
      env:
        CONFIG_INPUT: ${{ inputs.config }}
        ROOT_INPUT: ${{ inputs.root }}
        ASSETS_INPUT: ${{ inputs.assets }}
        UPDATE_INPUT: ${{ inputs.update }}
        TIMEZONE_INPUT: ${{ inputs.timezone }}
        AT_INPUT: ${{ inputs.at }}
        WINDOW_COUNT_INPUT: ${{ inputs.window-count }}
      run: bash "$GITHUB_ACTION_PATH/action.sh"
branding:
  icon: clock
  color: blue
